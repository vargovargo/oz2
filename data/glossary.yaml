# Glossary for the OZ finance study guide (/learn).
#
# This file is the single source of truth. It is rendered on /learn and exported
# to study/knowledge/06-glossary.md by scripts/export_study_pack.py.
# Edit here, then re-run the script — do not hand-edit the generated markdown.
#
# Fields:
#   term        short label, usually the acronym (required)
#   expansion   what the acronym stands for; null for plain-language terms
#   definition  1-3 sentences, plain language (required)
#   see_also    list of other `term` values in this file
#   site_link   deep link into an existing page that explains it in context

- term: 180-day rule
  expansion: null
  definition: >-
    The window an investor has to move a realized capital gain into a Qualified
    Opportunity Fund. Miss it and the gain is taxed normally — there is no OZ
    benefit available for a gain that was not rolled over in time.
  see_also: [QOF, Deferred gain]
  site_link: /capital-stack#qrof-mechanics

- term: AMI / MFI
  expansion: Area Median Income / Median Family Income
  definition: >-
    The income benchmark a tract is measured against. "Area" means the MSA or
    metropolitan division for metro tracts, and the statewide non-metro figure
    for rural tracts — which is why an identical household income can be
    low-income in one county and middle-income in the next.
  see_also: [LMI, CRA]
  site_link: /capital-stack#cra

- term: B&I
  expansion: Business & Industry Guaranteed Loan
  definition: >-
    A USDA Rural Development program that guarantees up to 85% of a loan under
    $5M (80% above that) for rural business development. The guarantee is what
    lets a small local bank write a loan it could not otherwise hold, which is
    why B&I often sits in the senior position of a rural stack.
  see_also: [Senior debt]
  site_link: /capital-stack#usda-rural-development

- term: Basis step-up
  expansion: null
  definition: >-
    An increase in the tax basis of the deferred gain, which permanently reduces
    the amount eventually taxed. OZ 2.0 grants 10% at the five-year mark for a
    standard QOF and 30% for a QROF. It applies to the original gain only — not
    to appreciation inside the fund, which is handled by the 10-year exclusion.
  see_also: [QROF, Deferred gain]
  site_link: /capital-stack#qrof-mechanics

- term: CBA
  expansion: Community Benefits Agreement
  definition: >-
    A negotiated, enforceable agreement between a developer and community
    representatives covering things like local hiring, affordability set-asides,
    and procurement. Nothing in OZ law requires one; the leverage comes from
    timing and from the § 6039K data a fund must report anyway.
  see_also: ['§ 6039K']
  site_link: /capital-stack#oz-reporting

- term: CDE
  expansion: Community Development Entity
  definition: >-
    The certified intermediary that receives an NMTC allocation and deploys it
    into qualifying businesses and facilities. A CDE deploying debt cannot itself
    be a QOF, because a QOF has to hold QOZ property rather than debt instruments.
  see_also: [NMTC, QOF]
  site_link: /capital-stack#nmtc

- term: CDFI
  expansion: Community Development Financial Institution
  definition: >-
    A mission-driven lender certified by the Treasury's CDFI Fund — a loan fund,
    credit union, bank, or venture fund serving markets conventional capital
    underserves. In OZ deals a CDFI is usually the subordinate lender, the
    predevelopment financier, or the vehicle through which bank CRA money reaches
    the project.
  see_also: [EQ2, CRA, CDE]
  site_link: /capital-stack#cdfi

- term: CF
  expansion: Community Facilities Direct Loan & Grant
  definition: >-
    USDA financing for essential community facilities — healthcare, public
    safety, education, cultural — in communities under 20,000 population. Its use
    restriction means it rarely shares an entity with OZ equity; the usual pattern
    is a facility funded by CF next to a commercial element funded by a QOF.
  see_also: [B&I]
  site_link: /capital-stack#usda-rural-development

- term: CRA
  expansion: Community Reinvestment Act
  definition: >-
    The 1977 law requiring bank regulators to assess whether a bank is meeting
    credit needs across its whole deposit area, weighted toward low- and
    moderate-income geographies. It is the single biggest reason a commercial bank
    has an interest in a distressed-tract deal that would not otherwise clear its
    return threshold.
  see_also: [LMI, 'D/U', EQ2]
  site_link: /capital-stack#cra

- term: D/U
  expansion: Distressed or Underserved
  definition: >-
    The FFIEC flag that qualifies a non-metro middle-income tract (80–120% of the
    statewide non-metro median) for CRA credit on distress grounds rather than
    income — via unemployment at 1.5x the national rate, poverty at 20%+,
    population loss of 10%+, or a very remote USDA urban influence code. Many bank
    CRA officers do not know this track exists.
  see_also: [CRA, LMI, UIC]
  site_link: /capital-stack#cra

- term: DCI
  expansion: Distressed Communities Index
  definition: >-
    EIG's composite ranking of economic distress at the ZIP and tract level. Used
    on this site as a need overlay; investors use it as a screen, and Treasury's
    analysis of OZ 1.0 used a comparable distress index to show that the most
    distressed deciles got the least capital.
  see_also: []
  site_link: null

- term: Deferred gain
  expansion: null
  definition: >-
    The original capital gain an investor rolled into a QOF. Under OZ 2.0 it is
    deferred until the earlier of the sale of the QOF interest or the investment's
    fifth anniversary — a rolling deadline, unlike OZ 1.0's single fixed date.
  see_also: [180-day rule, Basis step-up]
  site_link: /capital-stack#qrof-mechanics

- term: EQ2
  expansion: Equity-Equivalent Investment
  definition: >-
    Long-maturity, deeply subordinated debt that behaves like equity on a CDFI's
    balance sheet. Banks buy EQ2s for CRA credit; the CDFI leverages them into
    project lending. This is the most common path by which bank capital reaches
    an OZ deal without the bank touching OZ compliance at all.
  see_also: [CDFI, CRA, Subordinate debt]
  site_link: /capital-stack#cra

- term: Gap financing
  expansion: null
  definition: >-
    Whatever fills the space between what a project costs and what debt plus
    equity will actually pay for it. Grants, soft loans, tax credit proceeds, and
    public subsidy live here. Rural deals have larger gaps because appraised
    values — and therefore loan proceeds — are lower relative to construction cost.
  see_also: [Sources and uses, Senior debt]
  site_link: /learn#capital-stacks

- term: LIC
  expansion: Low-Income Community
  definition: >-
    The statutory eligibility test shared by OZ and NMTC — broadly, a poverty rate
    of at least 20%, or median family income at or below 80% of the applicable
    benchmark (70% of statewide MFI for non-metro tracts under the OZ 2.0 rules,
    with a 125% cap in metro areas).
  see_also: [NMTC, LMI]
  site_link: /off-list-nominations

- term: LIHTC
  expansion: Low-Income Housing Tax Credit
  definition: >-
    The primary federal subsidy for affordable rental housing, allocated by state
    housing agencies and sold to investors through syndication. OBBBA raised the
    9% allocation permanently by 12% and dropped the 4% bond financing threshold
    from 50% to 25%.
  see_also: [Syndication, PAB]
  site_link: /capital-stack#lihtc

- term: LMI
  expansion: Low- and Moderate-Income
  definition: >-
    Track 1 of CRA eligibility — a tract whose median family income is under 80%
    of the area figure. Low Income is under 50%, Moderate is 50–80%. Examiners
    weight Low Income tracts most heavily.
  see_also: [CRA, 'D/U', AMI / MFI]
  site_link: /capital-stack#cra

- term: Mezzanine debt
  expansion: null
  definition: >-
    A tranche sitting between senior debt and equity — repaid after the senior
    lender, before the equity, and priced for that risk. Often secured by a pledge
    of ownership interests rather than by the property itself.
  see_also: [Senior debt, Subordinate debt]
  site_link: /learn#capital-stacks

- term: NMTC
  expansion: New Markets Tax Credit
  definition: >-
    A 39% federal credit claimed over seven years by investors who put equity into
    a CDE, which then finances businesses and facilities in low-income tracts.
    Made permanent at $5B a year by OBBBA. Legal and structuring costs put a
    practical floor around $3–5M in project size.
  see_also: [CDE, LIC]
  site_link: /capital-stack#nmtc

- term: PAB
  expansion: Private Activity Bond
  definition: >-
    Tax-exempt bonds issued by a state or local authority for a qualifying private
    project. Financing at least 25% of a residential project with PABs (down from
    50% under OBBBA) triggers an as-of-right 4% LIHTC allocation.
  see_also: [LIHTC]
  site_link: /capital-stack#lihtc

- term: PRI
  expansion: Program-Related Investment
  definition: >-
    A below-market investment a foundation makes in service of its charitable
    purpose, counting toward its payout requirement. PRIs frequently occupy the
    subordinate or gap layer of a community development stack.
  see_also: [Gap financing, Subordinate debt]
  site_link: null

- term: QOF
  expansion: Qualified Opportunity Fund
  definition: >-
    The investment vehicle — a corporation or partnership — that must hold at
    least 90% of its assets in qualified opportunity zone property, measured as
    the average of two testing dates a year rather than continuously. An
    investor's OZ tax benefit runs through the QOF, not through the project
    directly. Funds self-certify on Form 8996.
  see_also: [QOZB, QROF, QOZ property]
  site_link: /capital-stack#qrof-mechanics

- term: QOZ property
  expansion: Qualified Opportunity Zone property
  definition: >-
    What a QOF is allowed to hold to satisfy its 90% asset test — QOZ stock, QOZ
    partnership interests, or QOZ business property. Notably, it does not include
    loans, which is why a debt-issuing lender cannot double as a QOF.
  see_also: [QOF, CDE]
  site_link: /capital-stack#qrof-mechanics

- term: QOZB
  expansion: Qualified Opportunity Zone Business
  definition: >-
    The operating business or project entity a QOF invests into. The QOZB is where
    the substantial improvement test and the day-to-day operating requirements
    actually bite.
  see_also: [QOF, Substantial improvement]
  site_link: /capital-stack#qrof-mechanics

- term: QROF
  expansion: Qualified Rural Opportunity Fund
  definition: >-
    A QOF that satisfies the 90% asset test with property in zones comprised
    entirely of rural area — not merely a fund holding some rural assets. It
    carries a 30% basis step-up at five years instead of 10%, and its businesses
    face a 50% substantial improvement threshold instead of 100%. The rural flag
    is assigned by Treasury and cannot be earned through advocacy.
  see_also: [QOF, Basis step-up, Substantial improvement]
  site_link: /capital-stack#qrof-mechanics

- term: Senior debt
  expansion: null
  definition: >-
    The first-position loan, secured by the property and repaid before every other
    layer. Cheapest money in the stack because it takes the last loss. In a rural
    OZ deal it is typically a bank loan, often carrying a USDA guarantee.
  see_also: [Mezzanine debt, 'B&I', Sources and uses]
  site_link: /learn#capital-stacks

- term: Sources and uses
  expansion: null
  definition: >-
    The two-column table at the heart of any deal — every dollar coming in
    (sources) set against every dollar going out (uses). They must balance. A
    project "has a gap" precisely when uses exceed the sources anyone has
    committed to.
  see_also: [Gap financing]
  site_link: /learn#capital-stacks

- term: Subordinate debt
  expansion: null
  definition: >-
    Any loan that agrees to stand behind the senior lender in repayment and in
    claim on collateral. CDFI notes and EQ2s usually sit here. Subordination is
    what makes the senior loan possible, and it is priced accordingly.
  see_also: [Mezzanine debt, EQ2, CDFI]
  site_link: /learn#capital-stacks

- term: Substantial improvement
  expansion: null
  definition: >-
    The test requiring a QOZB acquiring existing property to reinvest an amount
    equal to that property's adjusted basis within 30 months. Standard zones
    require 100%; rural zones require 50% — which is often the difference between
    a viable rural rehab and an impossible one.
  see_also: [QOZB, QROF]
  site_link: /capital-stack#qrof-mechanics

- term: Syndication
  expansion: null
  definition: >-
    Selling tax credits to investors who can use them, converting a future credit
    stream into present-day equity. The syndicator's fee and the price per credit
    dollar determine how much of the credit's face value actually reaches the deal.
  see_also: [LIHTC, NMTC]
  site_link: /capital-stack#lihtc

- term: UIC
  expansion: Urban Influence Code
  definition: >-
    A USDA county classification of metro adjacency and remoteness. Codes 7, 10,
    11, and 12 mark very remote geography and can trip the FFIEC distressed or
    underserved flag on their own.
  see_also: ['D/U']
  site_link: /capital-stack#cra

- term: § 6039K
  expansion: null
  definition: >-
    The OZ 2.0 provision requiring QOFs to file annual information returns
    covering assets, QOZ property, employment, NAICS codes, and housing units,
    effective for tax years beginning after December 31, 2026. Paired with
    § 6039L (QOZB-to-QOF data) and § 6726 penalties, it is the disclosure regime
    OZ 1.0 lacked.
  see_also: [CBA, QOF]
  site_link: /capital-stack#oz-reporting
