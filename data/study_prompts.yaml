# Suggested study prompts for the OZ finance study guide (/learn).
#
# This file is the single source of truth. It is rendered on /learn and exported
# to study/prompts.md by scripts/export_study_pack.py.
# Edit here, then re-run the script — do not hand-edit the generated markdown.
#
# Fields:
#   id         stable slug (required, unique)
#   module     one of: tax-incentive, capital-stacks, banks-and-cra,
#              cdfis, deal-economics, evidence-check (required)
#   prompt     the full text to paste into a chat (required)
#   why        one line on what this prompt is good for (required)
#   followups  optional list of shorter next-turn prompts

# ---------------------------------------------------------------- tax incentive

- id: tax-walk-the-dollar
  module: tax-incentive
  prompt: >-
    Follow a single dollar of capital gain all the way through the OZ 2.0
    incentive. I sell stock today and realize a $1,000,000 gain. Walk me through
    every date that matters, what I owe and when, and what I keep — first for a
    standard QOF, then for a QROF. Show the arithmetic at each step rather than
    describing it.
  why: Builds the whole mechanism from one concrete number instead of definitions.
  followups:
    - What changes if I sell in year 7 instead of holding to year 10?
    - Where exactly does the money come from to pay the year-5 tax bill?

- id: tax-three-benefits
  module: tax-incentive
  prompt: >-
    People say OZ has "three tax benefits." Name them precisely, then tell me
    which one is actually worth the most in present-value terms for a
    ten-year hold, and why the answer surprises people. Be explicit about what
    OZ 2.0 changed versus OZ 1.0.
  why: Separates the deferral, the step-up, and the exclusion — routinely conflated.
  followups:
    - Rank them again for a five-year hold. Does the order change?

- id: tax-qof-qozb-qrof
  module: tax-incentive
  prompt: >-
    Draw me the entity chain for an OZ deal — investor, QOF, QOZB, the actual
    building or business — and tell me which requirement attaches at which level.
    I keep mixing up which tests apply to the fund and which apply to the
    operating business.
  why: The 90% asset test and the substantial improvement test live at different levels.
  followups:
    - What breaks if the QOZB fails the substantial improvement test at month 31?

- id: tax-substantial-improvement
  module: tax-incentive
  prompt: >-
    Explain the substantial improvement test as a construction budget problem. I
    am buying a $2M building on a $500K lot in a rural OZ tract. How much do I
    have to spend, over what period, and how does the 50% rural threshold change
    the answer versus the 100% standard one? Show what gets counted and what
    does not.
  why: The land-versus-improvements split is where this test actually gets decided.

- id: tax-what-oz-is-not
  module: tax-incentive
  prompt: >-
    Play devil's advocate. I am a local planner who thinks OZ designation will
    bring money to my town. Explain, without softening it, what the incentive
    does and does not do — specifically that it lowers the cost of equity for
    people who already have realized gains, and what that implies about which
    projects and which places it will actually reach.
  why: The single most useful correction for anyone new to the program.

# --------------------------------------------------------------- capital stacks

- id: stack-sources-and-uses
  module: capital-stacks
  prompt: >-
    Build me a sources-and-uses table for a $4,000,000 rural grocery store
    redevelopment. Put a USDA B&I guaranteed loan in the senior position, a CDFI
    subordinate note beneath it, and QROF equity on top. Then tell me which layer
    absorbs the first dollar of loss, which layer gets paid first, and why the
    QROF investor tolerates being last in line.
  why: Forces seniority, pricing, and risk to be explained together rather than separately.
  followups:
    - Now the appraisal comes in 20% low. Show me the revised table and who has to move.

- id: stack-why-a-gap
  module: capital-stacks
  prompt: >-
    Why does the same building cost roughly the same to construct in a rural
    county as in a metro one but support a much smaller loan? Walk me through
    appraised value, loan-to-value, and debt service coverage as the mechanism,
    and then show me how that arithmetic produces the financing gap that
    everything else in the stack exists to fill.
  why: The structural reason rural deals need stacking at all.

- id: stack-where-oz-sits
  module: capital-stacks
  prompt: >-
    Where does OZ equity actually sit in a capital stack, and how is it different
    from ordinary developer equity or a tax credit investment? Compare it
    side by side with LIHTC equity and NMTC-financed debt on: position, what the
    investor is buying, required hold period, and what happens at exit.
  why: OZ equity behaves unlike the other subsidies it gets grouped with.

- id: stack-who-is-in-the-room
  module: capital-stacks
  prompt: >-
    For a $6M mixed-use project in a rural OZ tract, list every party who
    plausibly ends up in the capital stack, what each one wants, what each one is
    afraid of, and in what order I should approach them. Include the ones people
    forget.
  why: Sequencing the ask matters as much as the structure.
  followups:
    - Which of these can I approach before the tract is even designated?

- id: stack-read-a-real-one
  module: capital-stacks
  prompt: >-
    Here is a capital stack from a real project — [paste the sources list].
    Reverse-engineer it for me. What does each layer tell you about the deal's
    risk, who had leverage in the negotiation, and what the sponsor probably had
    to give up to close it?
  why: A template for taking any real deal you encounter and learning from it.

# ---------------------------------------------------------------- banks and CRA

- id: cra-why-a-bank-shows-up
  module: banks-and-cra
  prompt: >-
    Explain why a commercial bank would lend into a deal that does not clear its
    normal return threshold. Start from what the Community Reinvestment Act
    actually obligates a bank to do, how examiners measure it, and what a bad
    rating costs the bank. I want the incentive, not the civics.
  why: CRA only makes sense once you see it as an examination the bank can fail.

- id: cra-two-track
  module: banks-and-cra
  prompt: >-
    Walk me through the two tracks of CRA tract eligibility. For Track 1, be
    precise about what income is measured against what benchmark, and how that
    benchmark differs for a metro versus a rural tract. For Track 2, list every
    distress criterion and explain why the track exists at all.
  why: Track 2 is invisible to most people, including many bank CRA officers.
  followups:
    - Why would a bank CRA officer assume a middle-income tract is ineligible?

- id: cra-three-channels
  module: banks-and-cra
  prompt: >-
    A bank wants CRA credit connected to an OZ project. Compare its three
    realistic options — a community development loan, an equity-equivalent
    investment in a CDFI, and direct equity into a QOF — on how clean the CRA
    credit is, how much OZ compliance the bank has to absorb, and how quickly it
    can move. Recommend one and say why.
  why: These three are not interchangeable, and the differences drive deal design.

- id: cra-the-gap
  module: banks-and-cra
  prompt: >-
    Roughly three quarters of OZ-eligible tracts carry a CRA designation, but
    about 2,500 rural tracts hold the QROF rural bonus and no CRA flag at all.
    Explain what that combination means for a planner in one of those tracts, and
    build me a realistic financing approach that does not depend on bank CRA
    motivation.
  why: The hardest-to-finance segment, and the one the headline overlap number hides.

- id: cra-make-the-ask
  module: banks-and-cra
  prompt: >-
    Draft what I would actually say to a community bank's CRA officer about a
    project in a Track 2 distressed/underserved tract. Assume they have never
    heard of Track 2. Keep it under 200 words, lead with what is in it for them,
    and tell me what document to bring to the meeting.
  why: Turns the mechanics into the conversation you will really have.

# ---------------------------------------------------------------------- CDFIs

- id: cdfi-what-is-one
  module: cdfis
  prompt: >-
    What is a CDFI, concretely? Cover the different types, how one gets certified,
    and — most importantly — where its money comes from. I want to understand a
    CDFI's own balance sheet before I understand its lending.
  why: You cannot predict what a CDFI will do for you until you know how it is funded.
  followups:
    - How does a CDFI decide what it can price a loan at?

- id: cdfi-why-not-a-qof
  module: cdfis
  prompt: >-
    Why can't a CDFI simply become a Qualified Opportunity Fund and solve the
    whole problem? Walk me through the specific legal reason, then tell me what a
    CDFI can do instead that gets close to the same outcome.
  why: A common and reasonable-sounding idea that runs into the QOZ property definition.

- id: cdfi-eq2-mechanics
  module: cdfis
  prompt: >-
    Explain an EQ2 as if I were the CDFI's CFO. What are the actual terms, why
    does it count as equity for leverage purposes while remaining debt, what does
    the bank get, and what happens to it in a downside scenario?
  why: EQ2s are the main conduit from bank capital to community deals and are poorly understood.

- id: cdfi-predevelopment
  module: cdfis
  prompt: >-
    My town has an OZ-eligible tract and no projects. Explain the role a CDFI can
    play before there is any deal to finance — predevelopment, feasibility,
    technical assistance — and how that work changes whether a QOF ever shows up.
    Be specific about what I would be asking for and who pays for it.
  why: The pre-deal role is where CDFIs matter most in places with no pipeline.

- id: cdfi-find-and-approach
  module: cdfis
  prompt: >-
    Give me a method for finding which CDFIs actually operate in a specific rural
    county, distinguishing the ones that lend there from the ones that merely list
    the state in their service area. Then tell me how to read a CDFI's recent
    lending to figure out whether my project fits it.
  why: The certified list is long; the list of CDFIs that will actually lend to you is short.

# -------------------------------------------------------------- deal economics

- id: econ-what-is-the-stepup-worth
  module: deal-economics
  prompt: >-
    Quantify the QROF rural bonus. Take an investor with a $2,000,000 deferred
    gain, assume a plausible federal capital gains rate, and show me in dollars
    what the 30% step-up is worth compared to the standard 10% — then translate
    that into how many percentage points of project return the investor can give
    up and still be indifferent.
  why: Converts a tax provision into the number a sponsor can actually negotiate against.

- id: econ-irr-hurdle
  module: deal-economics
  prompt: >-
    Teach me hurdle rates using this deal. An impact-oriented fund says it needs a
    12% IRR. Explain what IRR is measuring, why a ten-year OZ hold makes it a
    tricky metric, and what levers a sponsor has to move a project from 8% to 12%
    without changing the rents.
  why: The vocabulary investors negotiate in, taught against a real constraint.
  followups:
    - Which of those levers destroys community benefit and which does not?

- id: econ-timeline-friction
  module: deal-economics
  prompt: >-
    NMTC investors exit at seven years when their credits finish vesting. OZ
    investors need ten years for the full exclusion. Explain exactly what goes
    wrong when both are in the same project, then show me the structures people
    use to live with it and what each one costs.
  why: The most-cited structuring problem in OZ stacking, usually asserted and never explained.

- id: econ-deal-size-floors
  module: deal-economics
  prompt: >-
    Why does NMTC have a practical floor around $3–5 million in project size when
    there is no such number in the statute? Walk through the actual cost items
    that create the floor. Then do the same exercise for OZ equity — what is the
    smallest deal where forming or joining a QOF is worth the trouble?
  why: Explains why most federal tools quietly exclude small rural projects.

- id: econ-negotiate-against
  module: deal-economics
  prompt: >-
    A QOF sponsor wants to invest in my town. Given everything the OZ 2.0
    incentive gives them — the deferral, the step-up, the ten-year exclusion, and
    the rural bonus if it applies — what can I credibly ask for in return, and
    what is the strongest evidence-based version of that argument? Tell me also
    where my leverage is weakest.
  why: The point of learning the finance — being able to negotiate with it.

# --------------------------------------------------------------- evidence check

- id: ev-where-did-the-money-go
  module: evidence-check
  prompt: >-
    Summarize what the Treasury data actually shows about where OZ 1.0 capital
    went through tax year 2024 — total volume, share of tracts funded, how
    concentrated the investment was, and the rural share. Then tell me which of
    those findings should change how I think about a nomination decision today.
  why: The empirical baseline against which every OZ finance argument should be checked.
  followups:
    - Which of these numbers is most likely to be different under OZ 2.0, and why?

- id: ev-rural-gap
  module: evidence-check
  prompt: >-
    Rural tracts were roughly 38% of OZ 1.0 zones but received about 16% of the
    investment, and funded rural zones got far less per tract than non-rural ones.
    Diagnose that gap. How much of it is the incentive's design, how much is
    deal-size economics, and how much is local intermediary capacity? Be honest
    about what the QROF bonus can and cannot fix.
  why: Tests whether the rural incentive story survives contact with the outcome data.

- id: ev-who-invested
  module: evidence-check
  prompt: >-
    What do we know about who the OZ 1.0 investors actually were — how many, what
    incomes, individuals versus corporations — and how does that compare with
    NMTC's investor base? Explain what that difference in investor type implies
    about which kinds of projects each program will finance.
  why: Investor composition predicts project composition; this is the underrated finding.

- id: ev-reporting-changed
  module: evidence-check
  prompt: >-
    Under OZ 1.0 funds self-certified and faced no real penalty for not reporting.
    Explain what §§ 6039K, 6039L, and 6726 change, what they still do not require,
    and how a community organization could realistically use the new reporting to
    hold a project accountable. Do not let "requires reporting" slide into
    "ensures benefit."
  why: The OZ 2.0 correction, and its limits — the distinction most coverage blurs.

- id: ev-stress-test-me
  module: evidence-check
  prompt: >-
    Quiz me. Ask one question at a time across OZ tax mechanics, capital stack
    structure, CRA, and CDFI financing. Start easy, get harder based on how I
    answer, and after each answer tell me what I got wrong or what I stated more
    confidently than the evidence supports. Do not move on until I have it.
  why: The reason to have a conversational tutor at all rather than a page.
