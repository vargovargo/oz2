    First new commercial construction in the historic Anacostia neighborhood in over three decades,
    developed by Black-owned DC firm The Menkiti Group on the corner of Good Hope Road and Martin
    Luther King Jr. Avenue SE. Phase one delivered roughly 34,000 square feet of retail and office
