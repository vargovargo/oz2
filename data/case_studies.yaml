- id: arctaris-broadband-maine
  title: "Arctaris/GWI Rural Fiber Broadband Network"
  state: "Maine"
  state_slug: maine
  location: "South Portland, Belfast, Millinocket, East Millinocket & Medway, ME"
  sector_tags: [broadband, rural_development]
  size_tag: large
  investment_amount_usd: 60000000
  year: 2021
  rural: true
  summary: >
    Arctaris Impact Investors committed roughly $60 million in Opportunity Zone equity,
    backed by Finance Authority of Maine guaranty agreements, to build fiber-to-the-premises
    broadband across five underserved Maine communities — about 12,000 residential and
    business locations. Arctaris Broadband Company owns the network; Maine ISP GWI builds
    and operates it, one of the few documented OZ-financed broadband infrastructure deals.
  source_name: "Business Wire: Arctaris Funds Broadband Fiber in Opportunity Zones to Increase Digital Equity"
  source_url: "https://www.businesswire.com/news/home/20210217005595/en/Arctaris-Funds-Broadband-Fiber-in-Opportunity-Zones-to-Increase-Digital-Equity"
  source_type: press_release
  last_checked: "2026-06-16"

- id: miller-springs-or
  title: "Miller Springs"
  state: "Oregon"
  state_slug: oregon
  location: "Burns, OR"
  sector_tags: [rural_development, mixed_use]
  size_tag: large
  investment_amount_usd: 10000000
  year: 2025
  rural: true
  summary: >
    A 1,200-acre master-planned community in rural Harney County aiming to build "a city
    within a city" — 160 approved homesites for workforce housing affordable at or below
    130% of area median income. Phase one infrastructure (about $10 million) was funded
    entirely by stacking federal, state, and local incentives, including the Opportunity
    Zone designation, and is projected to generate over $3.1 million in new local tax
    receipts over 20 years.
  source_name: "Miller Springs (official project site)"
  source_url: "https://millersprings.com/"
  source_type: press_release
  last_checked: "2026-06-16"

- id: centennial-yards-ga
  title: "Centennial Yards"
  state: "Georgia"
  state_slug: georgia
  location: "Downtown Atlanta, GA"
  sector_tags: [mixed_use, anchor_institution]
  size_tag: large
  investment_amount_usd: 4200000000
  year: 2024
  rural: false
  summary: >
    A 50-acre redevelopment of Atlanta's long-vacant downtown rail yard ("The Gulch") into
    apartments, hotel rooms, retail, and a stadium district timed to host FIFA World Cup
    2026 matches. Opportunity Zone equity is one layer of a financing stack that also
    includes municipal bonds and bank debt; developer CIM Group lists the project in its
    own Opportunity Zones portfolio alongside other CIM OZ investments in Oakland, Los
    Angeles, and Dallas.
  source_name: "CIM Group: Opportunity Zones Portfolio"
  source_url: "https://www.cimgroup.com/our-platforms/real-estate/opportunity-zones"
  source_type: press_release
  last_checked: "2026-06-16"
