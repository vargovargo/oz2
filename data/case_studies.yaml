- id: koz-on-mlk-wa
  title: "Kōz on MLK"
  state: "Washington"
  state_slug: washington
  location: "Tacoma, WA (Hilltop)"
  sector_tags: [affordable_housing]
  size_tag: medium
  investment_amount_usd: 8700000
  year: 2022
  rural: false
  summary: >
    161-unit affordable and workforce housing building in Tacoma's Hilltop neighborhood, a
    historically Black community facing displacement pressure from Seattle's spillover housing
    market. Developed by female-owned Kōz Development using $8.7 million in Opportunity Zone
    equity from Catalyst Opportunity Funds; 85% of units priced below 60% of area median income
    and 100% below 80% AMI, with rents starting under $1,000 per month including utilities. A
    tenant survey found that 16% of residents would have faced homelessness without the project and
    69% had no cheaper equivalent housing option available. Ground-floor space houses a Seattle
    Credit Union branch providing banking and ITIN support to underserved residents.
