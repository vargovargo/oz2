  rural: true
  summary: >
    A $12 million mixed-use redevelopment of six historic downtown buildings in Brookville, Indiana
    (population ~3,000) — including the 1852 Valley House Hotel — into 47 affordable and market-rate
    apartments for active adults aged 55 and older, with ground-floor retail including a pharmacy,
    restaurant, and primary care facility. Developed by Flaherty & Collins Properties, it was the
