  process: "The Mississippi Development Authority (MDA) is leading the state's OZ\
    \ 2.0 designation process under authority delegated by the governor, with Tim\
    \ T. Climer, PCED (Community and Rural Development), serving as the point of contact\
    \ at tclimer@mississippi.org or (601) 359-9387. MDA held at least three public\
    \ listening sessions in April 2026 — at the Oxford-Lafayette County Chamber of\
    \ Commerce (April 10), the Central Mississippi Planning and Development District\
    \ in Pearl (April 14), and the Southern Mississippi Planning and Development District\
    \ (April 21) — and a stakeholder feedback form on the MDA website remains open\
    \ through May 31, 2026 for written input. This is a public comment process, not\
    \ a direct nomination form: MDA solicits perspectives from local governments,\
    \ economic development professionals, business leaders, and community partners,\
    \ then makes its own internal assessment of which tracts show the strongest potential\
    \ for economic growth and investment. No scoring rubric or weighted selection\
    \ criteria have been published as of May 6, 2026. After the May 31 input deadline,\
    \ MDA will prepare its nomination list, which the governor must formally submit\
