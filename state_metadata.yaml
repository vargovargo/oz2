  process: The Arizona Commerce Authority administers a map-based recommendation process
    in which counties, tribal nations, and—in Maricopa, Pima, and Pinal counties—incorporated
    communities of 10,000 or more submit tract nominations directly through an interactive
    GIS tool, each providing a brief written justification per tract. Jurisdictions
    are generally asked to recommend no more than one quarter of their eligible tracts;
    tribal nations may weigh in on tribal territory statewide regardless of county
    boundaries. ACA's published criteria emphasize investment readiness, including
    available water, power, and sewer connections, zoning and entitlement status, proximity
    to roads and population centers, open land or sites suitable for redevelopment, and
    the capacity to support investor-profitable projects. A community submission deadline
    in mid-May 2026 was described by ACA but had not been formally set as of 2026-05-06.
    ACA intends to submit Arizona's nominations to Treasury on or around July 1, 2026,
    with new designations taking effect January 1, 2027.
