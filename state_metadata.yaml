  process: 'The North Carolina Department of Commerce is running a public feedback
    process on behalf of Governor Josh Stein, who will make final tract nominations
    to Treasury during the July–September 2026 designation window. Local officials,
    community organizations, and other stakeholders download an Excel feedback form
    from public.nccommerce.com/oz and email completed submissions to OZ-Feedback@commerce.nc.gov
    by June 7, 2026 at 11:59 p.m. Respondents identify which eligible tracts they
    support and explain alignment with one or more of NC Commerce''s three published
    guidelines: Business Development (tracts with high-growth, high-wage sector potential
    including advanced manufacturing, technology, life sciences, and clean energy;
    Commerce- or EDPNC-certified industrial or mega sites; and projects with capital
    investment already underway), Revitalization (tracts backed by documented local
    plans or recent public investment for site redevelopment, mixed-use, or other
    community-driven initiatives), and Housing Supply (tracts near major employment
    centers or transit corridors where OZ designation can meaningfully expand housing
    production, with documented regional housing need). No numerical weights have
    been published for the three guidelines. After the feedback window closes, Commerce
    reviews submissions and provides recommendations to the Governor; the state''s
    202 nominations are due to Treasury beginning July 1, 2026.'
