    Organizations (ADOs), and other community entities may submit applications on behalf
    of eligible tracts, and Commerce has published a scoring criteria document (PDF)
    and a draft application template to help communities prepare. Questions must be
    submitted by May 21, 2026 — just seven days before the application deadline —
    so local planners should prioritize reviewing the scoring criteria and drafting
    materials well in advance; two pre-proposal webinars were held May 7 (9–10 a.m.
    for rural and non-rural communities; 11 a.m.–noon for tribal governments). Consistent
    with Governor Ferguson's Executive Order 25-10, the Centennial Accord, and RCW
    43.376, Commerce is conducting formal government-to-government tribal consultation
    with Washington's 29 federally recognized tribes as a separate, parallel track
    — not a substitute for tribes also submitting applications through the RFA portal.
    Commerce's recommendations are due to the Governor by June 30, 2026, ahead of
    the federal nomination window opening July 1, 2026; Washington will nominate 99
    tracts from 394 eligible, down from 139 current OZs.
